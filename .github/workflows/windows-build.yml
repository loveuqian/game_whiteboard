name: Windows Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Windows application
        run: flutter build windows

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: game_whiteboard-windows
          path: build/windows/x64/runner/Release/**

      - name: Package Windows application
        if: github.event_name == 'push'
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath game_whiteboard-windows.zip -Force

      - name: Publish Windows release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-latest"
          $notes = "由 master 分支自动构建，提交：${{ github.sha }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            git tag -f $tag $env:GITHUB_SHA
            git push origin "refs/tags/$tag" --force
            gh release edit $tag --title "Windows 最新版" --notes $notes --latest
            gh release upload $tag game_whiteboard-windows.zip --clobber
          } else {
            gh release create $tag game_whiteboard-windows.zip --target $env:GITHUB_SHA --title "Windows 最新版" --notes $notes --latest
          }
